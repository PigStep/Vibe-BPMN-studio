name: CI - Pytest (E2E)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pytest-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv
          uv sync

      - name: Run e2e tests
        run: |
          .venv/bin/python -m pytest -v -k "e2e"
        env:
          ENVIROMENT: test

      - name: Upload e2e test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: .pytest_cache/
          retention-days: 7