[project]
name = "bpmn-creator"
version = "0.6.6"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.0",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "openai>=2.11.0",
    "uvicorn>=0.38.0",
    "langgraph>=1.0.5",
    "google-genai>=1.67.0",
    "langchain-core>=1.2.6",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.12",
]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.9",
    "pytest-asyncio>=1.3.0",
    "anyio>=4.12.1",
]

[tool.ruff]
exclude = ["build", "dist", ".venv", ".git", "*.ipynb"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
